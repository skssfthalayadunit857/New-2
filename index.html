<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKSSF Thalayad Unit</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box
}

html{
    scroll-behavior:smooth
}

body{
    font-family:"Noto Sans Malayalam",sans-serif;
    background:#07090d;
    color:#f5f7fa;
}

a{
    text-decoration:none;
    color:inherit
}

img{
    width:100%;
    display:block
}

.container{
    width:92%;
    max-width:1180px;
    margin:auto
}

/* TOP BAR */
.topbar{
    background:#080b12;
    color:#b9c9d5;
    font-size:12px;
    padding:9px 0;
    border-bottom:1px solid rgba(158,220,255,.12);
}

.topbar .container{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

/* HEADER */
header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(7,9,13,.92);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(158,220,255,.12);
}

.navbar{
    min-height:76px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px
}

.brand-logo{
    width:52px;
    height:52px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #8ee6b5;
    background:#101821;
}

.brand h1{
    font-size:18px;
    line-height:1.1;
    color:#f8fbff;
    font-weight:800;
}

.brand span{
    font-size:10px;
    color:#91a1ad
}

nav ul{
    display:flex;
    gap:24px;
    list-style:none
}

nav a{
    font-size:13px;
    font-weight:600;
    color:#c4cdd5;
    transition:.3s
}

nav a:hover{
    color:#9edcff
}

.menu{
    display:none;
    border:0;
    background:#12251e;
    color:#fff;
    width:42px;
    height:42px;
    border-radius:10px;
    font-size:20px;
}

/* HERO */
.hero{
    min-height:650px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
    linear-gradient(110deg,rgba(4,7,11,.94),rgba(11,30,26,.62)),
    url("hero.jpg") center/cover;
}

.hero:after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(
        to top,
        #07090d 0%,
        transparent 38%,
        rgba(7,9,13,.15) 100%
    );
}

.hero:before{
    content:"";
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    right:-180px;
    top:-150px;
    background:rgba(142,230,181,.06);
}

.hero-content{
    position:relative;
    z-index:2;
    max-width:760px;
    color:white
}

.tag{
    display:inline-block;
    border:1px solid rgba(158,220,255,.3);
    background:rgba(158,220,255,.07);
    color:#9edcff;
    padding:7px 15px;
    border-radius:30px;
    font-size:12px;
    margin-bottom:20px;
}

.hero h2{
    font-size:clamp(38px,6vw,70px);
    line-height:1.12;
    font-weight:800;
    margin-bottom:20px;
}

.hero h2 span{
    color:#8ee6b5
}

.hero p{
    max-width:650px;
    color:#d2dbe1;
    font-size:16px
}

.buttons{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    margin-top:30px
}

.btn{
    padding:12px 22px;
    border-radius:10px;
    font-size:13px;
    font-weight:700;
    display:inline-block;
    transition:.3s
}

.btn:hover{
    transform:translateY(-3px)
}

.btn-green{
    background:#8ee6b5;
    color:#07110c
}

.btn-blue{
    border:1px solid rgba(158,220,255,.55);
    color:#9edcff
}

/* SECTIONS */
section{
    padding:80px 0
}

.section-head{
    text-align:center;
    margin-bottom:42px
}

.section-head small{
    color:#9edcff;
    font-weight:800;
    font-size:11px;
    letter-spacing:2px;
}

.section-head h2{
    color:#f7fafc;
    font-size:32px;
    margin:5px 0
}

.section-head p{
    color:#8997a2;
    font-size:13px;
    max-width:650px;
    margin:auto
}

/* ABOUT */
.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:45px;
    align-items:center
}

.about-photo{
    height:420px;
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 18px 45px rgba(0,0,0,.35);
    border:1px solid rgba(158,220,255,.1);
}

.about-photo img{
    height:100%;
    object-fit:cover
}

.about h3{
    font-size:28px;
    color:#8ee6b5;
    margin-bottom:15px
}

.about p{
    color:#9aa8b2;
    font-size:14px;
    margin-bottom:14px
}

.points{
    display:grid;
    gap:10px;
    margin-top:20px
}

.point{
    padding:13px 15px;
    background:#0d1218;
    border-radius:11px;
    border:1px solid rgba(158,220,255,.08);
    box-shadow:0 4px 18px rgba(0,0,0,.18);
    font-size:13px
}

/* STATS */
.stats{
    background:linear-gradient(100deg,#0b1714,#0b1720);
    border-top:1px solid rgba(142,230,181,.12);
    border-bottom:1px solid rgba(158,220,255,.12);
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr)
}

.stat{
    text-align:center;
    padding:18px
}

.stat-icon{
    font-size:28px
}

.stat strong{
    display:block;
    font-size:35px;
    margin:3px 0;
    color:#f8fbff
}

.stat span{
    color:#9edcff;
    font-size:12px
}

/* COMMITTEE */
.committee{
    background:#07090d
}

.committee-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:18px
}

.member{
    background:linear-gradient(145deg,#0d1218,#0a0f14);
    border:1px solid rgba(158,220,255,.09);
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 28px rgba(0,0,0,.25);
    transition:.35s
}

.member:hover{
    transform:translateY(-7px);
    border-color:rgba(142,230,181,.4)
}

.member-photo{
    height:210px;
    background:linear-gradient(135deg,#10231c,#101b25);
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.member-photo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.member-photo.no-photo:before{
    content:"SKSSF";
    font-size:30px;
    font-weight:800;
    letter-spacing:2px;
    color:rgba(158,220,255,.3)
}

.member-info{
    padding:16px;
    text-align:center
}

.member-info h3{
    color:#f4f7f9;
    font-size:15px;
    line-height:1.45
}

.member-info p{
    color:#8ee6b5;
    font-size:11px;
    font-weight:700;
    margin-top:5px
}

/* ROLE */
.role-title{
    margin:48px 0 20px;
    display:flex;
    align-items:center;
    gap:12px
}

.role-title:first-child{
    margin-top:0
}

.role-title span{
    width:8px;
    height:30px;
    border-radius:5px;
    background:linear-gradient(#8ee6b5,#9edcff)
}

.role-title h3{
    font-size:22px;
    color:#f5f8fa
}

/* PROGRAMS */
.programs{
    background:#0a0f14;
    border-top:1px solid rgba(158,220,255,.08);
    border-bottom:1px solid rgba(158,220,255,.08);
}

.program-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px
}

.program{
    background:#0e141b;
    padding:25px;
    border-radius:17px;
    border:1px solid rgba(158,220,255,.08);
    box-shadow:0 7px 25px rgba(0,0,0,.2);
    transition:.3s
}

.program:hover{
    transform:translateY(-5px);
    border-color:rgba(142,230,181,.3)
}

.program-icon{
    width:48px;
    height:48px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(142,230,181,.1);
    border:1px solid rgba(142,230,181,.15);
    border-radius:12px;
    font-size:23px;
    margin-bottom:15px
}

.program h3{
    color:#f1f5f7;
    font-size:17px;
    margin-bottom:7px
}

.program p{
    color:#8997a2;
    font-size:13px
}

/* GALLERY */
.gallery-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px
}

.gallery-item{
    height:220px;
    overflow:hidden;
    border-radius:15px;
    cursor:pointer;
    border:1px solid rgba(158,220,255,.08)
}

.gallery-item img{
    height:100%;
    object-fit:cover;
    transition:.4s
}

.gallery-item:hover img{
    transform:scale(1.08)
}

/* NEWS */
.news{
    background:#0a0f14
}

.news-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px
}

.news-card{
    background:#0e141b;
    border-radius:17px;
    padding:22px;
    border:1px solid rgba(158,220,255,.08);
    box-shadow:0 6px 25px rgba(0,0,0,.2)
}

.news-date{
    color:#9edcff;
    font-size:11px;
    font-weight:800
}

.news-card h3{
    color:#f2f6f8;
    margin:7px 0;
    font-size:17px
}

.news-card p{
    color:#8997a2;
    font-size:13px
}

/* CONTACT */
.contact-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px
}

.contact-card{
    background:#0d1218;
    padding:28px;
    border-radius:18px;
    border:1px solid rgba(158,220,255,.08);
    box-shadow:0 7px 25px rgba(0,0,0,.22)
}

.contact-row{
    display:flex;
    gap:14px;
    margin-bottom:22px
}

.contact-icon{
    width:45px;
    height:45px;
    min-width:45px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(142,230,181,.1);
    border:1px solid rgba(142,230,181,.13);
    border-radius:11px
}

.contact-row h4{
    color:#f2f6f8;
    font-size:14
